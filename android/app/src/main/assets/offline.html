<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<meta name="color-scheme" content="dark">
<title>Spup</title>
<style>
  :root { color-scheme: dark; --brand: #1A9E5F; --brand-hover: #22B86E; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0A0A0A; color: #F2F2F2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "DM Sans", Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%; overflow-x: hidden; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: calc(32px + env(safe-area-inset-top)) 28px calc(32px + env(safe-area-inset-bottom)); }

  .mark { font-size: 30px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 30px; }

  /* ── Scene: a wall socket and a plug that has come out of it ── */
  #scene { width: min(340px, 92vw); height: auto; display: block; margin-bottom: 26px; overflow: hidden; }
  .plate  { fill: #1B1B1B; stroke: #333; stroke-width: 2; }
  .slot   { fill: #070707; }
  .prong  { fill: #A8A8A8; }
  .plug-body { fill: var(--brand); }
  .plug-ridge { fill: #0F5A35; }
  .cable  { fill: none; stroke: #4A4A4A; stroke-width: 8; stroke-linecap: round; }
  #led    { fill: #E5484D; transition: fill .3s ease; }
  #ledGlow { fill: #E5484D; opacity: .25; transition: fill .3s ease, opacity .3s ease; }
  .spark  { fill: none; stroke: #F5C451; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  #plug  { transition: transform .5s cubic-bezier(.34, 1.25, .5, 1); }
  #float { animation: drift 3.2s ease-in-out infinite; }
  #sparks { animation: flicker 1.8s steps(1, end) infinite; transition: opacity .2s ease; }
  @keyframes drift   { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-7px); } }
  @keyframes flicker { 0%, 100% { opacity: 0; } 8% { opacity: 1; } 14% { opacity: 0; } 52% { opacity: 0; } 58% { opacity: 1; } 64% { opacity: 0; } }
  @keyframes nope    { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 45% { transform: translateX(6px); } 70% { transform: translateX(-3px); } }
  #scene.shake { animation: nope .4s ease; }

  /* Button pressed: the plug reaches for the socket */
  body[data-state="trying"] #plug { transform: translateX(-38px); }
  body[data-state="trying"] #float { animation: none; }
  /* Connected: plug is home, light goes green */
  body[data-state="online"] #plug { transform: translateX(-76px); }
  body[data-state="online"] #float,
  body[data-state="online"] #sparks { animation: none; }
  body[data-state="online"] #sparks { opacity: 0; }
  body[data-state="online"] #led { fill: var(--brand); }
  body[data-state="online"] #ledGlow { fill: var(--brand); opacity: .45; }

  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 700; letter-spacing: -0.2px; }
  p  { margin: 0 0 26px; font-size: 15px; line-height: 1.55; color: #A3A3A3; max-width: 320px; }

  button { appearance: none; -webkit-appearance: none; border: 0; border-radius: 999px; padding: 14px 32px; min-width: 168px;
    font: inherit; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 9px;
    background: var(--brand); color: #fff; -webkit-tap-highlight-color: transparent; transition: background .15s ease, opacity .15s ease; }
  button:active { opacity: .85; }
  button[disabled] { background: #124D30; opacity: .85; }
  button svg { width: 17px; height: 17px; }
  body[data-state="trying"] button svg { animation: spin .8s linear infinite; }
  body[data-state="online"] button { display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status { margin-top: 18px; font-size: 13px; color: #737373; min-height: 18px; }
  body[data-state="online"] .status { color: var(--brand-hover); }

  @media (prefers-reduced-motion: reduce) {
    #float, #sparks, #scene.shake, body[data-state="trying"] button svg { animation: none; }
    #sparks { opacity: 1; }
    #plug { transition-duration: .01s; }
  }
</style>
</head>
<body data-state="idle">
<main>
  <div class="mark">Spup</div>

  <svg id="scene" viewBox="0 0 360 170" role="img" aria-label="A plug that has come out of its wall socket">
    <!-- Socket (fixed) -->
    <g id="socket">
      <circle id="ledGlow" cx="30" cy="58" r="10"/>
      <rect class="plate" x="12" y="42" width="80" height="86" rx="16"/>
      <rect class="slot" x="62" y="68" width="30" height="11" rx="4"/>
      <rect class="slot" x="62" y="92" width="30" height="11" rx="4"/>
      <circle id="led" cx="30" cy="58" r="4.5"/>
    </g>

    <!-- Sparks across the gap while disconnected -->
    <g id="sparks">
      <path class="spark" d="M104 80 l9 -8 l-3 10 l11 -9 l-4 11 l10 -6"/>
      <path class="spark" d="M108 98 l7 5 l-2 -8 l9 4"/>
    </g>

    <!-- Plug (slides into the socket) -->
    <g id="plug">
      <g id="float">
        <path class="cable" d="M238 85 C 266 85 262 138 298 138 S 350 104 440 120"/>
        <rect class="prong" x="150" y="69" width="22" height="9" rx="3"/>
        <rect class="prong" x="150" y="93" width="22" height="9" rx="3"/>
        <rect class="plug-body" x="168" y="51" width="70" height="68" rx="16"/>
        <rect class="plug-ridge" x="190" y="66" width="5" height="38" rx="2.5"/>
        <rect class="plug-ridge" x="203" y="66" width="5" height="38" rx="2.5"/>
        <rect class="plug-ridge" x="216" y="66" width="5" height="38" rx="2.5"/>
      </g>
    </g>
  </svg>

  <h1 id="title">No connection</h1>
  <p id="sub">We can&rsquo;t reach Spup right now. Check your Wi&#8209;Fi or mobile data &mdash; we&rsquo;ll reconnect you automatically the moment it&rsquo;s back.</p>

  <button id="retry" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/>
    </svg>
    <span id="retryLabel">Try again</span>
  </button>
  <div class="status" id="status" role="status" aria-live="polite"></div>
</main>

<script>
(function () {
  var ORIGIN = 'https://spup.live';

  // Where to go once we're back. The app passes the page that failed to load
  // as ?u=..., so the person lands where they were heading - not on the home
  // page. Anything that isn't https on spup.live is ignored.
  function resolveTarget() {
    try {
      var u = new URLSearchParams(window.location.search).get('u');
      if (u) {
        var url = new URL(u);
        var h = url.hostname;
        if (url.protocol === 'https:' && (h === 'spup.live' || h.slice(-10) === '.spup.live')) return url.href;
      }
    } catch (e) { /* fall through */ }
    return ORIGIN + '/';
  }
  var TARGET = resolveTarget();

  var body = document.body;
  var btn = document.getElementById('retry');
  var label = document.getElementById('retryLabel');
  var titleEl = document.getElementById('title');
  var subEl = document.getElementById('sub');
  var statusEl = document.getElementById('status');
  var scene = document.getElementById('scene');
  var busy = false, done = false, delay = 3000, timer = null;

  function setState(s) { body.setAttribute('data-state', s); }

  function probe() {
    // Can we reach the site at all? (no-cors: we only care that the request gets through)
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var t = setTimeout(function () { if (ctrl) ctrl.abort(); }, 7000);
    return fetch(ORIGIN + '/manifest.json?ts=' + Date.now(), { mode: 'no-cors', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
      .then(function () { clearTimeout(t); return true; })
      .catch(function () { clearTimeout(t); return false; });
  }

  function connected() {
    done = true;
    clearTimeout(timer);
    setState('online');
    titleEl.textContent = 'Back online';
    subEl.textContent = 'Taking you back to Spup\u2026';
    statusEl.textContent = '';
    setTimeout(function () { window.location.replace(TARGET); }, 900);
  }

  function attempt(manual) {
    if (busy || done) return;
    busy = true;
    btn.disabled = true;
    if (manual) {
      setState('trying');                 // plug reaches for the socket
      label.textContent = 'Connecting\u2026';
    }
    statusEl.textContent = manual ? '' : 'Reconnecting\u2026';
    probe().then(function (ok) {
      if (ok) { connected(); return; }
      busy = false;
      btn.disabled = false;
      label.textContent = 'Try again';
      setState('idle');                   // plug falls back
      if (manual) {
        scene.classList.remove('shake');
        void scene.getBoundingClientRect();   // restart the animation
        scene.classList.add('shake');
        statusEl.textContent = 'Still no connection. We\u2019ll keep trying.';
      } else {
        statusEl.textContent = '';
      }
      schedule();
    });
  }

  function schedule() {
    clearTimeout(timer);
    timer = setTimeout(function () { attempt(false); }, delay);
    delay = Math.min(Math.round(delay * 1.5), 12000);   // gentle back-off while offline
  }

  btn.addEventListener('click', function () { delay = 3000; attempt(true); });
  window.addEventListener('online', function () { delay = 3000; attempt(false); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) attempt(false); });
  window.addEventListener('pageshow', function () { attempt(false); });
  schedule();
})();
</script>
</body>
</html>
